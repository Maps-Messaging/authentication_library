// Run from the repository root, after provisioning examples/config/apache/.htpassword.
// Example only: this file contains paths/options, never a password.
ExampleApache {
  io.mapsmessaging.security.jaas.IdentityLoginModule required
    debug=false
    identityName="Apache-Basic-Auth"
    configDirectory="./examples/config/apache";
};

// The TLS layer must validate the peer chain before passing certificate principals.
ExampleCertificate {
  io.mapsmessaging.security.jaas.SSLCertificateLoginModule required
    debug=false;
};

// Deployment template: replace issuer domain and audience with your actual API values.
ExampleAuth0Jwt {
  io.mapsmessaging.security.jaas.Auth0JwtLoginModule required
    debug=false
    auth0Domain="tenant.example.auth0.com"
    audience="https://api.example.com/";
};
